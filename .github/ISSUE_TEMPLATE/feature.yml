name: Feature request
description: Suggest something Bolo could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Bolo help?
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.2, MacBook Pro M3
