<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="258" rx="24" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>

  <!-- 1. Hold fn -->
  <g transform="translate(60 40)">
    <rect x="40" y="20" width="120" height="96" rx="18" fill="#EEF3FF" stroke="#1F6BFF" stroke-width="3"/>
    <text x="100" y="80" text-anchor="middle" font-size="40" font-weight="600" fill="#0F1B33">fn</text>
    <text x="100" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">1. Hold fn</text>
    <text x="100" y="188" text-anchor="middle" font-size="16" fill="#5B6478">anywhere you type</text>
  </g>

  <path d="M270 108 h40" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round"/>
  <path d="M302 98 l12 10 l-12 10" fill="none" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Speak -->
  <g transform="translate(350 40)">
    <rect x="10" y="38" width="180" height="60" rx="30" fill="#1F6BFF"/>
    <circle cx="44" cy="68" r="10" fill="#FFFFFF"/>
    <rect x="76" y="52" width="9" height="32" rx="4.5" fill="#FFFFFF"/>
    <rect x="94" y="58" width="9" height="20" rx="4.5" fill="#FFFFFF"/>
    <rect x="112" y="46" width="9" height="44" rx="4.5" fill="#FFFFFF"/>
    <rect x="130" y="56" width="9" height="24" rx="4.5" fill="#FFFFFF"/>
    <rect x="148" y="61" width="9" height="14" rx="4.5" fill="#FFFFFF"/>
    <text x="100" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">2. Speak</text>
    <text x="100" y="188" text-anchor="middle" font-size="16" fill="#5B6478">as you'd talk</text>
  </g>

  <path d="M570 108 h40" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round"/>
  <path d="M602 98 l12 10 l-12 10" fill="none" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Let go -->
  <g transform="translate(640 40)">
    <rect x="0" y="20" width="200" height="96" rx="14" fill="#EEF3FF"/>
    <text x="16" y="56" font-size="16" fill="#0F1B33">See you at 5, and</text>
    <text x="16" y="80" font-size="16" fill="#0F1B33">bring the slides.</text>
    <rect x="148" y="66" width="2.5" height="18" fill="#1F6BFF"/>
    <text x="100" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">3. Let go</text>
    <text x="100" y="188" text-anchor="middle" font-size="16" fill="#5B6478">clean text is typed</text>
  </g>
</svg>
