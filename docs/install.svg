<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="260" rx="24" fill="#16171B"/>

  <!-- 1. Open Terminal -->
  <g transform="translate(50 40)">
    <rect x="40" y="20" width="140" height="96" rx="14" fill="#000" stroke="#3A3C44" stroke-width="2"/>
    <circle cx="58" cy="36" r="5" fill="#FF5F57"/><circle cx="74" cy="36" r="5" fill="#FEBC2E"/><circle cx="90" cy="36" r="5" fill="#28C840"/>
    <text x="56" y="84" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#28C840">&gt;_</text>
    <text x="110" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#ECECEA">1. Open Terminal</text>
    <text x="110" y="188" text-anchor="middle" font-size="16" fill="#9A9CA3">⌘ Space, type Terminal</text>
  </g>

  <path d="M280 108 h40" stroke="#5A5D66" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 98 l12 10 l-12 10" fill="none" stroke="#5A5D66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Paste the command -->
  <g transform="translate(345 40)">
    <rect x="0" y="34" width="210" height="64" rx="12" fill="#000" stroke="#FF9F0A" stroke-width="2"/>
    <text x="18" y="73" font-family="Menlo, Consolas, monospace" font-size="15" fill="#ECECEA">$ curl … | bash</text>
    <text x="105" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#ECECEA">2. Paste the command</text>
    <text x="105" y="188" text-anchor="middle" font-size="16" fill="#9A9CA3">press Return, answer 4 questions</text>
  </g>

  <path d="M580 108 h40" stroke="#5A5D66" stroke-width="3" stroke-linecap="round"/>
  <path d="M612 98 l12 10 l-12 10" fill="none" stroke="#5A5D66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Allow access -->
  <g transform="translate(650 40)">
    <g font-size="15" fill="#ECECEA">
      <rect x="0" y="12" width="200" height="34" rx="8" fill="#2A2C33"/>
      <text x="14" y="34">Microphone</text>
      <rect x="0" y="52" width="200" height="34" rx="8" fill="#2A2C33"/>
      <text x="14" y="74">Accessibility</text>
      <rect x="0" y="92" width="200" height="34" rx="8" fill="#2A2C33"/>
      <text x="14" y="114">Input Monitoring</text>
    </g>
    <g fill="#28C840"><rect x="160" y="20" width="30" height="18" rx="9"/><rect x="160" y="60" width="30" height="18" rx="9"/><rect x="160" y="100" width="30" height="18" rx="9"/></g>
    <g fill="#fff"><circle cx="181" cy="29" r="7"/><circle cx="181" cy="69" r="7"/><circle cx="181" cy="109" r="7"/></g>
    <text x="100" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#ECECEA">3. Allow Bolo</text>
    <text x="100" y="188" text-anchor="middle" font-size="16" fill="#9A9CA3">then quit &amp; reopen it</text>
  </g>
</svg>
