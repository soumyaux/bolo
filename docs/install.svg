<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="258" rx="24" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>

  <!-- 1. Open Terminal -->
  <g transform="translate(50 40)">
    <rect x="40" y="20" width="140" height="96" rx="14" fill="#FFFFFF" stroke="#1F6BFF" stroke-width="2"/>
    <circle cx="58" cy="36" r="5" fill="#C9D4EA"/><circle cx="74" cy="36" r="5" fill="#C9D4EA"/><circle cx="90" cy="36" r="5" fill="#C9D4EA"/>
    <text x="56" y="84" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#1F6BFF">&gt;_</text>
    <text x="110" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">1. Open Terminal</text>
    <text x="110" y="188" text-anchor="middle" font-size="16" fill="#5B6478">⌘ Space, type Terminal</text>
  </g>

  <path d="M280 108 h40" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 98 l12 10 l-12 10" fill="none" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Paste the command -->
  <g transform="translate(345 40)">
    <rect x="0" y="34" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#1F6BFF" stroke-width="2"/>
    <text x="18" y="73" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F1B33">$ curl … | bash</text>
    <text x="105" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">2. Paste the command</text>
    <text x="105" y="188" text-anchor="middle" font-size="16" fill="#5B6478">press Return, answer 4 questions</text>
  </g>

  <path d="M580 108 h40" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round"/>
  <path d="M612 98 l12 10 l-12 10" fill="none" stroke="#A9B4C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Allow access -->
  <g transform="translate(650 40)">
    <g font-size="15" fill="#0F1B33">
      <rect x="0" y="12" width="200" height="34" rx="8" fill="#EEF3FF"/>
      <text x="14" y="34">Microphone</text>
      <rect x="0" y="52" width="200" height="34" rx="8" fill="#EEF3FF"/>
      <text x="14" y="74">Accessibility</text>
      <rect x="0" y="92" width="200" height="34" rx="8" fill="#EEF3FF"/>
      <text x="14" y="114">Input Monitoring</text>
    </g>
    <g fill="#1F6BFF"><rect x="160" y="20" width="30" height="18" rx="9"/><rect x="160" y="60" width="30" height="18" rx="9"/><rect x="160" y="100" width="30" height="18" rx="9"/></g>
    <g fill="#fff"><circle cx="181" cy="29" r="7"/><circle cx="181" cy="69" r="7"/><circle cx="181" cy="109" r="7"/></g>
    <text x="100" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F1B33">3. Allow Bolo</text>
    <text x="100" y="188" text-anchor="middle" font-size="16" fill="#5B6478">then quit &amp; reopen it</text>
  </g>
</svg>
